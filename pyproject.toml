[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemagent-index"
version = "0.2.0"
description = "Auditable chemistry AI evaluation infrastructure"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "rdkit>=2025.3", "numpy>=2,<3", "pydantic>=2.9,<3", "pyyaml>=6,<7", "typer>=0.15,<1", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "pip-audit"]
[project.scripts]
chemagent = "chemagent.cli:app"
[tool.setuptools.packages.find]
include = ["chemagent*", "backend*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations", "tests", "scripts"]
[tool.coverage.run]
source = ["chemagent.benchmarks", "chemagent.scoring", "chemagent.statistics", "chemagent.chemistry"]
[tool.coverage.report]
fail_under = 80
show_missing = true
